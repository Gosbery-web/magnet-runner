<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no" />
  <title>Магнит — кассир-раннер (вертикально)</title>
  <style>
    html, body { margin:0; height:100%; background:#0f0f10; overflow:hidden; }
    body{
      display:flex; align-items:center; justify-content:center;
      font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial;
      overscroll-behavior: none;
    }

    .wrap{
      width: min(100vw, 460px);
      height: 100vh;
      position: relative;
      display:flex;
      align-items:center;
      justify-content:center;
      padding: 10px;
      box-sizing: border-box;
    }

    canvas{
      width: 100%;
      height: auto;
      aspect-ratio: 9 / 16;
      max-height: calc(100vh - 20px);
      display:block;
      border-radius: 16px;
      background:#000;
      box-shadow: 0 18px 55px rgba(0,0,0,.45);
      touch-action: none; /* важно для мобилок */
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    /* Экран разблокировки аудио */
    .audio-unlock-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      color: white;
      text-align: center;
      padding: 20px;
      font-size: 18px;
      flex-direction: column;
    }

    .unlock-button {
      background: #c81f2a;
      color: white;
      border: none;
      padding: 15px 30px;
      font-size: 20px;
      border-radius: 10px;
      margin-top: 20px;
      cursor: pointer;
      font-weight: bold;
    }

    .unlock-button:hover { background: #d93641; }
    .unlock-button:active { transform: scale(0.98); }
  </style>
</head>
<body>
  <div class="wrap">
    <canvas id="c"></canvas>

    <div id="audioUnlockOverlay" class="audio-unlock-overlay">
      <div>
        <p style="font-size:22px;margin-bottom:10px;">🎵 ВКЛЮЧИТЬ ЗВУК 🎵</p>
        <p style="font-size:16px;margin-bottom:20px;opacity:.9;">Для полного погружения в игру</p>

        <button id="unlockButton" class="unlock-button">ВКЛЮЧИТЬ ЗВУК</button>

        <button id="noAudioButton" class="unlock-button" style="background:#444;margin-top:12px;">
          ИГРАТЬ БЕЗ ЗВУКА
        </button>

        <p style="font-size:14px;margin-top:20px;opacity:.7;">Можно также тапнуть по экрану</p>
      </div>
    </div>
  </div>

<script>
document.addEventListener('DOMContentLoaded', () => startGameScript());

function startGameScript() {
  const DEBUG = false;
  const log = (...a) => { if (DEBUG) console.log(...a); };

  const canvas = document.getElementById('c');
  const ctx = canvas.getContext('2d', { alpha:false });
  ctx.imageSmoothingEnabled = false;

  // ===== Polyfill roundRect ДО использования =====
  if (!CanvasRenderingContext2D.prototype.roundRect) {
    CanvasRenderingContext2D.prototype.roundRect = function(x, y, w, h, r) {
      if (w < 2 * r) r = w / 2;
      if (h < 2 * r) r = h / 2;
      this.beginPath();
      this.moveTo(x + r, y);
      this.arcTo(x + w, y, x + w, y + h, r);
      this.arcTo(x + w, y + h, x, y + h, r);
      this.arcTo(x, y + h, x, y, r);
      this.arcTo(x, y, x + w, y, r);
      this.closePath();
      return this;
    };
  }

  // ================= BASE RESOLUTION (вертикально) =================
  const W = 360, H = 640;
  canvas.width = W; canvas.height = H;

  // ================= FILES (рядом с index.html) =================
  // (если у тебя бывают проблемы с кешем — добавляй ?v=123 вручную к ссылке сайта, или включи VER ниже)
  // const VER = '1';
  // const V = '?v=' + VER;
  const V = '';

  const ASSET_BG_BACK   = 'bg_back.png' + V;
  const ASSET_BG_FRONT  = 'bg_front.png' + V;
  const ASSET_PLAYERRUN = 'cashier_run.png' + V;

  const ASSET_BAB1 = 'babushka.png' + V;
  const ASSET_BAB2 = 'babushka_cane.png' + V;
  const ASSET_BAB3 = 'babushka_cart.png' + V;

  const ASSET_BOX  = 'box.png' + V;

  const ASSET_MUSIC = 'music.mp3' + V;
  const ASSET_JUMP  = 'jump.wav' + V;
  const ASSET_HIT   = 'hit.wav' + V;

  // ================= АУДИО (10/10 под мобилки) =================
  let audioUnlocked = false;
  let allowNoAudio = false;
  let musicPlaying = false;

  const music = new Audio(ASSET_MUSIC);
  music.loop = true;
  music.volume = 0.30;
  music.preload = 'auto';

  const sfxJump = new Audio(ASSET_JUMP);
  sfxJump.volume = 0.45;
  sfxJump.preload = 'auto';

  const sfxHit = new Audio(ASSET_HIT);
  sfxHit.volume = 0.65;
  sfxHit.preload = 'auto';

  const audioUnlockOverlay = document.getElementById('audioUnlockOverlay');
  const unlockButton = document.getElementById('unlockButton');
  const noAudioButton = document.getElementById('noAudioButton');

  function setAudioMuted(muted){
    const mv = muted ? 0 : 0.30;
    const jv = muted ? 0 : 0.45;
    const hv = muted ? 0 : 0.65;
    music.volume = mv;
    sfxJump.volume = jv;
    sfxHit.volume  = hv;
  }

  function warmupAudio() {
    if (!audioUnlocked) return;
    // “прогрев” — тихо и коротко
    try {
      const t = sfxHit.cloneNode();
      t.volume = 0;
      t.play().then(()=>{ t.pause(); t.src=''; }).catch(()=>{});
    } catch {}
  }

  function startMusic(){
    if (!audioUnlocked) return;
    if (musicPlaying) return;
    if (music.volume === 0) return; // “без звука”
    try {
      music.currentTime = 0;
      music.play().then(()=> { musicPlaying = true; }).catch(()=>{ musicPlaying = false; });
    } catch { musicPlaying = false; }
  }

  function stopMusic(){
    try { music.pause(); } catch {}
    try { music.currentTime = 0; } catch {}
    musicPlaying = false;
  }

  function playSfx(a){
    if (!audioUnlocked) return;
    if (a.volume === 0) return; // “без звука”
    try {
      const c = a.cloneNode();
      c.volume = a.volume;
      c.play().catch(()=>{});
      c.onended = () => { try { c.src=''; } catch {} };
    } catch {}
  }

  async function unlockAudio() {
    if (audioUnlocked) return;
    log('unlockAudio...');
    try {
      // iOS/Android часто пропускает короткий sfx как “user gesture”
      sfxJump.currentTime = 0;
      await sfxJump.play();
      sfxJump.pause();
      sfxJump.currentTime = 0;

      audioUnlocked = true;
      allowNoAudio = false;
      setAudioMuted(false);
      audioUnlockOverlay.style.display = 'none';
      warmupAudio();

      // если уже были в игре/стартуем — музыка стартанёт
      if (scene === Scene.PLAY) startMusic();
    } catch (e) {
      // если не получилось — остаёмся на оверлее
      log('unlock fail', e);
    }
  }

  function continueWithoutAudio(){
    allowNoAudio = true;
    audioUnlocked = true;        // чтобы игра не блокировалась
    setAudioMuted(true);         // всё в 0
    stopMusic();
    audioUnlockOverlay.style.display = 'none';
    if (scene === Scene.MENU) startGame();
  }

  unlockButton.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); unlockAudio(); }, { passive:false });
  noAudioButton.addEventListener('click', (e)=>{ e.preventDefault(); e.stopPropagation(); continueWithoutAudio(); }, { passive:false });

  // тап по оверлею тоже пробует unlock
  audioUnlockOverlay.addEventListener('pointerdown', (e)=>{
    e.preventDefault();
    unlockAudio();
  }, { passive:false });

  // ================= IMAGES =================
  const bgBack = new Image(); bgBack.src = ASSET_BG_BACK;
  const bgFront = new Image(); bgFront.src = ASSET_BG_FRONT;
  const cashierRun = new Image(); cashierRun.src = ASSET_PLAYERRUN;
  const bab1 = new Image(); bab1.src = ASSET_BAB1;
  const bab2 = new Image(); bab2.src = ASSET_BAB2;
  const bab3 = new Image(); bab3.src = ASSET_BAB3;
  const boxImg = new Image(); boxImg.src = ASSET_BOX;

  const ready = { back:false, front:false, cashier:false, b1:false, b2:false, b3:false, box:false };
  bgBack.onload = ()=> ready.back=true;
  bgFront.onload = ()=> ready.front=true;
  cashierRun.onload = ()=> ready.cashier=true;
  bab1.onload = ()=> ready.b1=true;
  bab2.onload = ()=> ready.b2=true;
  bab3.onload = ()=> ready.b3=true;
  boxImg.onload = ()=> ready.box=true;

  // ================= GAME =================
  const Scene = { MENU:'menu', PLAY:'play', GAMEOVER:'gameover' };
  let scene = Scene.MENU;
  let best = Number(localStorage.getItem('magnet_runner_best') || 0);

  // ====== ВЕРТИКАЛЬНАЯ РАЗМЕТКА ======
  const HUD_H   = 96;
  const GAME_Y  = HUD_H;
  const GAME_H  = H - HUD_H;
  const GROUND_Y = H - 34;

  // ====== ФИЗИКА ПРЫЖКА (ЧЁТКАЯ ДУГА) ======
  // Всё зависит от "px/sec" и dt в секундах — так дуга будет одинаковой на любом FPS.
  const GRAVITY = 2600;      // px/s^2
  const JUMP_V0 = 980;       // px/s (вверх)
  const JUMP_CUT = 0.55;     // если отпустил рано — режем скорость вверх (для “мягкого” контроля)

  // скорость/сложность
  let worldSpeed = 260;      // px/s по земле (старт)
  const MAX_SPEED = 560;     // px/s
  const SPEED_INCREASE_INTERVAL = 1.2; // сек
  const SPEED_INCREMENT = 14; // px/s

  let speedTimer = 0;
  let difficultyLevel = 0;

  // Игрок
  const player = { x:70, y:GROUND_Y, w:72, h:100, vy:0, onGround:true };

  // Анимация
  const RUN_FRAMES = 4;
  let runFrame = 0, runTimer = 0;
  const RUN_FPS_BASE = 14;

  // Препятствия размеры (оставил близко к твоим, но чуть аккуратнее)
  const TARGET_BAB_HEIGHT  = 72;
  const TARGET_CANE_HEIGHT = 70;
  const TARGET_CART_HEIGHT = 66;
  const TARGET_BOX_HEIGHT  = 58;

  const MAX_BAB_WIDTH  = 78;
  const MAX_CANE_WIDTH = 78;
  const MAX_CART_WIDTH = 92;
  const MAX_BOX_WIDTH  = 78;

  // Гэпы: “честно”, без невозможных серий
  function minGapX() {
    const t = worldSpeed / MAX_SPEED;     // 0..1
    const base = 220 - t * 60;            // чем быстрее — тем меньше средний гэп
    const diff = difficultyLevel * 1.2;   // чуть плотнее со временем
    return Math.max(150, base - diff);
  }

  // ====== STATE ======
  let score = 0;
  let frozenScore = 0;
  let spawnCooldown = 0;  // сек
  let antiSpam = 0;       // сек
  const obstacles = [];
  let scrollBack = 0;
  let scrollFront = 0;
  let lastObstacleFamily = null;

  // Jump control
  let jumpHeld = false;
  let jumpedThisPress = false;

  // ====== UTILS ======
  function clamp(v, min, max){ return Math.max(min, Math.min(max, v)); }
  function rand(min, max){ return Math.random() * (max - min) + min; }
  function aspectW(img, targetH){
    const a = img.width / img.height;
    return Math.round(targetH * a);
  }
  function aabb(a, b){
    return (a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y);
  }

  function resetRun(){
    obstacles.length = 0;

    worldSpeed = 260;
    speedTimer = 0;
    difficultyLevel = 0;

    score = 0;
    frozenScore = 0;

    spawnCooldown = 0.45; // быстрее стартуем
    antiSpam = 0;

    scrollBack = 0;
    scrollFront = 0;

    player.y = GROUND_Y;
    player.vy = 0;
    player.onGround = true;

    runFrame = 0;
    runTimer = 0;

    lastObstacleFamily = null;

    jumpHeld = false;
    jumpedThisPress = false;
  }

  function startGame(){
    // если ни звук, ни “без звука” — блокируем через оверлей
    if (!audioUnlocked && !allowNoAudio) {
      audioUnlockOverlay.style.display = 'flex';
      return;
    }

    resetRun();
    scene = Scene.PLAY;

    // музыка строго после user gesture — но если audioUnlocked true, уже можно
    startMusic();
  }

  function goMenu(){
    scene = Scene.MENU;
    resetRun();
    stopMusic();
  }

  function die(){
    frozenScore = Math.floor(score);
    best = Math.max(best, frozenScore);
    localStorage.setItem('magnet_runner_best', String(best));

    playSfx(sfxHit);
    stopMusic();

    scene = Scene.GAMEOVER;
    player.vy = 0;
    player.onGround = true;

    jumpHeld = false;
    jumpedThisPress = false;
  }

  function doJump(){
    if (scene !== Scene.PLAY) return;
    if (!player.onGround) return;
    player.onGround = false;
    // вверх — отрицательная скорость по Y (так удобнее)
    player.vy = -JUMP_V0;
    playSfx(sfxJump);
  }

  function endJumpEarly(){
    // “обрезаем” прыжок, если отпустили рано и ещё летим вверх
    if (scene !== Scene.PLAY) return;
    if (player.vy < 0) {
      player.vy *= JUMP_CUT;
    }
  }

  function canSpawnNow(){
    if (obstacles.length === 0) return true;
    const last = obstacles[obstacles.length - 1];
    const lastRight = last.x + last.w;
    // спавним справа за экраном => чтобы на экране было расстояние
    return (W - lastRight) >= minGapX();
  }

  function chooseObstacleType(){
    const t = worldSpeed / MAX_SPEED;
    const boxChance = 0.42 + t * 0.08;   // 0.42..0.50
    const wantBox = Math.random() < boxChance;
    let family = wantBox ? 'box' : 'human';

    // лёгкое чередование, чтобы не было однотипной “полосы”
    if (lastObstacleFamily && Math.random() < 0.62 && family === lastObstacleFamily) {
      family = (family === 'box') ? 'human' : 'box';
    }
    lastObstacleFamily = family;

    if (family === 'box') return 'box';

    const r = Math.random();
    // чем быстрее — тем чаще тележка
    const cartBias = 0.18 + t * 0.20; // 0.18..0.38
    if (r < 0.52 - t*0.08) return 'bab1';
    if (r < 0.80 - t*0.04) return 'bab2';
    return (Math.random() < cartBias) ? 'bab3' : 'bab2';
  }

  function spawnObstacle(){
    const type = chooseObstacleType();
    let w=48, h=48;

    if (type === 'bab1') {
      h = TARGET_BAB_HEIGHT;
      w = ready.b1 ? aspectW(bab1, h) : 64;
      w = clamp(w, 42, MAX_BAB_WIDTH);
    } else if (type === 'bab2') {
      h = TARGET_CANE_HEIGHT;
      w = ready.b2 ? aspectW(bab2, h) : 62;
      w = clamp(w, 42, MAX_CANE_WIDTH);
    } else if (type === 'bab3') {
      h = TARGET_CART_HEIGHT;
      w = ready.b3 ? aspectW(bab3, h) : 80;
      w = clamp(w, 54, MAX_CART_WIDTH);
    } else if (type === 'box') {
      h = TARGET_BOX_HEIGHT;
      w = ready.box ? aspectW(boxImg, h) : 60;
      w = clamp(w, 40, MAX_BOX_WIDTH);
    }

    obstacles.push({
      type,
      x: W + 16,
      y: GROUND_Y - h,
      w, h
    });
  }

  // ================= UI =================
  function btnRectCentered(y, w=180, h=34){ return { x:(W - w)/2, y, w, h }; }
  const btnMenuPlay = () => btnRectCentered(Math.round(HUD_H + 225), 190, 38);
  const btnGoCont   = () => btnRectCentered(Math.round(HUD_H + 230), 210, 34);
  const btnGoMenu   = () => btnRectCentered(Math.round(HUD_H + 270), 210, 34);

  function pointInRect(px, py, r){ return px>=r.x && px<=r.x+r.w && py>=r.y && py<=r.y+r.h; }
  function toCanvasCoords(clientX, clientY){
    const rect = canvas.getBoundingClientRect();
    return { x:(clientX-rect.left)/rect.width*W, y:(clientY-rect.top)/rect.height*H };
  }

  function drawButton(r, label, fill, textColor){
    ctx.fillStyle = fill;
    ctx.beginPath();
    ctx.roundRect(r.x, r.y, r.w, r.h, 8);
    ctx.fill();

    ctx.fillStyle = 'rgba(0,0,0,0.18)';
    ctx.fillRect(r.x, r.y + r.h - 3, r.w, 3);

    ctx.fillStyle = textColor;
    ctx.font = 'bold 14px Arial, sans-serif';
    ctx.textAlign = 'center';
    ctx.fillText(label, r.x + r.w/2, r.y + 23);
    ctx.textAlign = 'left';
  }

  // ================= INPUT (10/10 совместимость) =================
  function handleTap(clientX, clientY){
    // если ещё не разблокировали звук — показываем оверлей и выходим
    if (!audioUnlocked && !allowNoAudio) {
      audioUnlockOverlay.style.display = 'flex';
      return;
    }

    const p = toCanvasCoords(clientX, clientY);

    if (scene === Scene.PLAY) { jumpHeld = true; if (!jumpedThisPress) { doJump(); jumpedThisPress = true; } return; }

    if (scene === Scene.MENU) {
      const b = btnMenuPlay();
      if (pointInRect(p.x, p.y, b)) startGame();
      return;
    }

    if (scene === Scene.GAMEOVER) {
      const b1 = btnGoCont(), b2 = btnGoMenu();
      if (pointInRect(p.x, p.y, b1)) startGame();
      else if (pointInRect(p.x, p.y, b2)) goMenu();
    }
  }

  function handleRelease(){
    if (scene !== Scene.PLAY) return;
    jumpHeld = false;
    jumpedThisPress = false;
    endJumpEarly();
  }

  // pointer
  canvas.addEventListener('pointerdown', (e)=>{ e.preventDefault(); handleTap(e.clientX, e.clientY); }, { passive:false });
  canvas.addEventListener('pointerup',   (e)=>{ e.preventDefault(); handleRelease(); }, { passive:false });
  canvas.addEventListener('pointercancel', (e)=>{ e.preventDefault(); handleRelease(); }, { passive:false });

  // touch fallback
  canvas.addEventListener('touchstart', (e)=>{
    e.preventDefault();
    const t = e.changedTouches[0];
    handleTap(t.clientX, t.clientY);
  }, { passive:false });

  canvas.addEventListener('touchend', (e)=>{
    e.preventDefault();
    handleRelease();
  }, { passive:false });

  // mouse fallback
  canvas.addEventListener('mousedown', (e)=>{ e.preventDefault(); handleTap(e.clientX, e.clientY); }, { passive:false });
  window.addEventListener('mouseup', ()=>handleRelease());

  // keyboard
  window.addEventListener('keydown', (e) => {
    if (!audioUnlocked && !allowNoAudio) {
      audioUnlockOverlay.style.display = 'flex';
      return;
    }

    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      if (scene === Scene.PLAY) { jumpHeld = true; if (!jumpedThisPress) { doJump(); jumpedThisPress = true; } }
      else if (scene === Scene.MENU) startGame();
    }
    if (e.code === 'Enter') {
      if (scene === Scene.MENU) startGame();
      else if (scene === Scene.GAMEOVER) startGame();
    }
    if (e.code === 'Escape') {
      if (scene === Scene.GAMEOVER) goMenu();
      else if (scene === Scene.PLAY) goMenu();
    }
  }, { passive:false });

  window.addEventListener('keyup', (e) => {
    if (e.code === 'Space' || e.code === 'ArrowUp') {
      e.preventDefault();
      handleRelease();
    }
  }, { passive:false });

  // ================= DRAW =================
  function drawTiledLayer(img, scrollX, drawY, drawH){
    const scale = drawH / img.height;
    const tileW = Math.ceil(img.width * scale);
    let x = -(scrollX % tileW);
    for (; x < W; x += tileW) ctx.drawImage(img, x, drawY, tileW, drawH);
  }

  function drawHud(){
    ctx.fillStyle = '#0b0b0c';
    ctx.fillRect(0, 0, W, HUD_H);

    ctx.fillStyle = '#c81f2a';
    ctx.fillRect(0, HUD_H - 18, W, 18);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 16px monospace';

    const shownScore = (scene === Scene.GAMEOVER) ? frozenScore : Math.floor(score);
    ctx.fillText(`Счёт: ${shownScore}`, 14, 30);
    ctx.fillText(`Рекорд: ${best}`, W - 170, 30);

    ctx.font = '11px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    ctx.fillText('МАГНИТ — КАССИР-РАННЕР', 14, 56);

    if (scene === Scene.PLAY) {
      ctx.font = '10px monospace';
      ctx.fillStyle = 'rgba(255,255,255,0.70)';
      const sp = Math.round((worldSpeed / MAX_SPEED) * 100);
      ctx.fillText(`Скорость: ${sp}%`, 14, 76);
    }
  }

  function drawBackgroundParallax(){
    ctx.fillStyle = '#000';
    ctx.fillRect(0, 0, W, H);

    if (!(ready.back && ready.front)) {
      ctx.fillStyle = '#fff';
      ctx.font = '12px monospace';
      ctx.fillText('Загрузка...', 10, 24);
      drawHud();
      return;
    }

    drawTiledLayer(bgBack,  scrollBack,  GAME_Y, GAME_H);
    drawTiledLayer(bgFront, scrollFront, GAME_Y, GAME_H);

    ctx.fillStyle = 'rgba(0,0,0,0.35)';
    ctx.fillRect(0, GAME_Y, W, 10);

    drawHud();
  }

  function drawPlayer(){
    const px = Math.round(player.x);
    const py = Math.round(player.y - player.h);

    if (ready.cashier) {
      const fw = Math.floor(cashierRun.width / RUN_FRAMES);
      const fh = cashierRun.height;
      const sx = runFrame * fw;
      ctx.drawImage(cashierRun, sx, 0, fw, fh, px, py, player.w, player.h);
    } else {
      ctx.fillStyle = '#c81f2a';
      ctx.fillRect(px, py, player.w, player.h);
    }
  }

  function drawObstacle(o){
    const x = Math.round(o.x), y = Math.round(o.y), w = Math.round(o.w), h = Math.round(o.h);
    if (o.type === 'bab1' && ready.b1) ctx.drawImage(bab1, x, y, w, h);
    else if (o.type === 'bab2' && ready.b2) ctx.drawImage(bab2, x, y, w, h);
    else if (o.type === 'bab3' && ready.b3) ctx.drawImage(bab3, x, y, w, h);
    else if (o.type === 'box' && ready.box) ctx.drawImage(boxImg, x, y, w, h);
    else { ctx.fillStyle = '#2d9cdb'; ctx.fillRect(x, y, w, h); }
  }

  function drawMenuOverlay(){
    ctx.fillStyle = 'rgba(0,0,0,0.70)';
    ctx.fillRect(0, 0, W, H);

    ctx.fillStyle = '#fff';
    ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('КАССИР-РАННЕР', W/2, HUD_H + 170);

    ctx.font = '13px monospace';
    ctx.fillStyle = 'rgba(255,255,255,0.90)';
    ctx.fillText('Прыгай через бабок и коробки', W/2, HUD_H + 195);
    ctx.textAlign = 'left';

    drawButton(btnMenuPlay(), 'ИГРАТЬ', '#c81f2a', '#fff');
  }

  function drawGameOverOverlay(){
    ctx.fillStyle = 'rgba(0,0,0,0.75)';
    ctx.fillRect(0, 0, W, H);

    const cardW = 280, cardH = 185;
    const cx = (W - cardW)/2, cy = HUD_H + 95;

    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.roundRect(cx, cy, cardW, cardH, 10);
    ctx.fill();

    ctx.fillStyle = '#111';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('ПРОДОЛЖИТЬ?', cx + cardW/2, cy + 34);

    ctx.font = '14px monospace';
    ctx.textAlign = 'left';
    ctx.fillText(`Счёт: ${frozenScore}`, cx + 20, cy + 72);
    ctx.fillText(`Рекорд: ${best}`, cx + 20, cy + 96);

    const sp = Math.round((worldSpeed / MAX_SPEED) * 100);
    ctx.fillText(`Скорость: ${sp}%`, cx + 20, cy + 120);

    drawButton(btnGoCont(), 'ПРОДОЛЖИТЬ', '#c81f2a', '#fff');
    drawButton(btnGoMenu(), 'В МЕНЮ', '#444', '#fff');

    ctx.textAlign = 'left';
  }

  // ================= LOOP =================
  let last = performance.now();

  function tick(now){
    const dtMs = Math.min(34, now - last);
    last = now;

    const dt = dtMs / 1000; // секунды

    if (scene === Scene.PLAY) {
      // скорость растёт предсказуемо
      speedTimer += dt;
      if (speedTimer >= SPEED_INCREASE_INTERVAL) {
        speedTimer -= SPEED_INCREASE_INTERVAL;
        if (worldSpeed < MAX_SPEED) {
          worldSpeed = Math.min(MAX_SPEED, worldSpeed + SPEED_INCREMENT);
          difficultyLevel++;
        }
      }

      // счёт чуть зависит от скорости (приятнее)
      const scoreMul = 1 + (worldSpeed - 260) / 520;
      score += dt * 120 * scoreMul;

      // параллакс
      const moveX = worldSpeed * dt;
      scrollBack  += moveX * 0.22;
      scrollFront += moveX * 0.75;

      // ====== физика прыжка (дуга) ======
      // вверх отрицательно
      player.vy += GRAVITY * dt;
      player.y  += player.vy * dt;

      if (player.y >= GROUND_Y) {
        player.y = GROUND_Y;
        player.vy = 0;
        player.onGround = true;
      }

      // если держим прыжок — НЕ добавляем “плато”,
      // но позволяем не резать скорость вверх. Если отпустил — endJumpEarly() уже обрежет.
      // (jumpHeld здесь влияет только тем, что мы НЕ вызываем endJumpEarly автоматически)
      // Реальный контроль — в endJumpEarly()

      // анимация: чем быстрее — тем чуть быстрее бег
      const runFps = RUN_FPS_BASE * (1 + (worldSpeed - 260) / 900);
      if (player.onGround) {
        runTimer += dt;
        const frameSec = 1 / runFps;
        if (runTimer >= frameSec) {
          runTimer -= frameSec;
          runFrame = (runFrame + 1) % RUN_FRAMES;
        }
      } else {
        runFrame = 1;
      }

      // spawn
      spawnCooldown -= dt;
      antiSpam -= dt;

      if (spawnCooldown <= 0 && antiSpam <= 0) {
        if (canSpawnNow()) {
          spawnObstacle();

          // анти-спам и кулдаун: гарантируем играбельность
          const t = worldSpeed / MAX_SPEED;
          antiSpam = Math.max(0.28, 0.78 - t * 0.40);

          const r = Math.random();
          let base;
          if (r < 0.22)      base = rand(0.55, 0.85); // близко, но реально
          else if (r < 0.84) base = rand(0.85, 1.45); // обычно
          else               base = rand(1.45, 2.25); // далеко

          // при высокой скорости — немного уменьшаем время, но не в “невозможно”
          base = Math.max(0.50, base - (worldSpeed - 260) / 1200);

          spawnCooldown = base;
        } else {
          spawnCooldown = 0.08;
        }
      }

      // движение + столкновения
      for (let i = obstacles.length - 1; i >= 0; i--) {
        const o = obstacles[i];
        o.x -= moveX;

        // Хитбокс игрока: компактный и “в центре”
        const pHit = {
          x: player.x + player.w * 0.34,
          y: (player.y - player.h) + player.h * 0.58,
          w: player.w * 0.32,
          h: player.h * 0.30
        };

        // Хитбокс препятствий: мягкий
        let oHit;
        if (o.type === 'bab3') {
          oHit = { x:o.x + 10, y:o.y + o.h*0.34, w:o.w - 20, h:o.h*0.56 };
        } else if (o.type === 'box') {
          oHit = { x:o.x + 12, y:o.y + 10, w:o.w - 24, h:o.h - 18 };
        } else {
          oHit = { x:o.x + 12, y:o.y + 8,  w:o.w - 24, h:o.h - 16 };
        }

        if (aabb(pHit, oHit)) { die(); break; }
        if (o.x + o.w < -100) obstacles.splice(i, 1);
      }
    }

    drawBackgroundParallax();
    for (const o of obstacles) drawObstacle(o);
    drawPlayer();

    if (scene === Scene.MENU) drawMenuOverlay();
    if (scene === Scene.GAMEOVER) drawGameOverOverlay();

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
}
</script>
